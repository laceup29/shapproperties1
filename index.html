<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharp Properties - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            width: 100%;
            position: relative;
        }

        .logo-container {
            margin-bottom: 25px;
            animation: fadeInDown 1s ease-out;
        }

        .logo {
            max-width: 140px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 20px auto;
            animation: expandWidth 1.5s ease-out;
        }

        .coming-soon {
            font-family: 'Playfair Display', serif;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #d4af37;
            margin-bottom: 15px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .tagline {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 10px;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .subtitle {
            font-size: 12px;
            font-weight: 300;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            animation: fadeInUp 1s ease-out 0.7s both;
        }

        .services {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        .service-item {
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999;
            position: relative;
            padding: 0 12px;
        }

        .service-item:not(:last-child)::after {
            content: '|';
            position: absolute;
            right: -12px;
            color: #d4af37;
        }

        .contact-section {
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            padding-top: 20px;
            animation: fadeInUp 1s ease-out 1.1s both;
        }

        .stay-connected {
            font-size: 9px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #d4af37;
            margin-bottom: 15px;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ccc;
            font-size: 11px;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
            text-decoration: none;
        }

        .contact-item:hover {
            color: #d4af37;
        }

        .contact-icon {
            font-size: 12px;
        }

        .decorative-element {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -50px;
            left: -50px;
            animation-delay: 1s;
        }

        .circle:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 10%;
            animation-delay: 2s;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes expandWidth {
            from {
                width: 0;
            }
            to {
                width: 80px;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.05);
            }
        }

        /* Tablet */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding-top: 60px;
            }

            .container {
                padding: 30px 15px;
            }

            .tagline {
                font-size: 22px;
            }

            .coming-soon {
                font-size: 10px;
                letter-spacing: 4px;
            }

            .subtitle {
                font-size: 12px;
            }

            .services {
                gap: 15px;
            }

            .service-item:not(:last-child)::after {
                display: none;
            }

            .contact-info {
                flex-direction: column;
                gap: 15px;
            }

            .logo {
                max-width: 120px;
            }

            .circle:nth-child(1) {
                width: 200px;
                height: 200px;
            }

            .circle:nth-child(2) {
                width: 150px;
                height: 150px;
            }

            .circle:nth-child(3) {
                width: 100px;
                height: 100px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding-top: 40px;
            }

            .container {
                padding: 20px 15px;
            }

            .logo {
                max-width: 100px;
            }

            .logo-container {
                margin-bottom: 20px;
            }

            .divider {
                margin: 15px auto;
            }

            .coming-soon {
                font-size: 9px;
                letter-spacing: 3px;
                margin-bottom: 12px;
            }

            .tagline {
                font-size: 18px;
                margin-bottom: 8px;
            }

            .subtitle {
                font-size: 11px;
                margin-bottom: 20px;
                line-height: 1.5;
            }

            .services {
                gap: 10px;
                margin-bottom: 20px;
            }

            .service-item {
                font-size: 8px;
                letter-spacing: 1.5px;
                padding: 0 8px;
            }

            .contact-section {
                padding-top: 15px;
            }

            .stay-connected {
                font-size: 8px;
                letter-spacing: 3px;
                margin-bottom: 12px;
            }

            .contact-info {
                gap: 12px;
            }

            .contact-item {
                font-size: 10px;
                gap: 6px;
            }

            .contact-icon {
                font-size: 11px;
            }

            .circle:nth-child(1) {
                width: 150px;
                height: 150px;
                top: -50px;
                right: -50px;
            }

            .circle:nth-child(2) {
                width: 100px;
                height: 100px;
                bottom: -30px;
                left: -30px;
            }

            .circle:nth-child(3) {
                width: 80px;
                height: 80px;
            }
        }

        /* Small Mobile */
        @media (max-width: 360px) {
            .container {
                padding: 15px 10px;
            }

            .logo {
                max-width: 85px;
            }

            .tagline {
                font-size: 16px;
            }

            .subtitle {
                font-size: 10px;
            }

            .service-item {
                font-size: 7px;
            }

            .contact-item {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div class="decorative-element">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="container">
        <div class="logo-container">
            <img src="Images/Logo.png" alt="Sharp Properties Logo" class="logo">
        </div>

        <div class="divider"></div>

        <p class="coming-soon">Website Coming Soon</p>

        <h1 class="tagline">We're Building Something Exceptional</h1>

        <p class="subtitle">
            Our new website will be launching soon with premium construction, 
            architectural design, and real estate services.
        </p>

        <div class="services">
            <span class="service-item">Real Estate</span>
            <span class="service-item">Construction</span>
            <span class="service-item">Design</span>
        </div>

        <div class="contact-section">
            <p class="stay-connected">Stay Connected</p>
            <div class="contact-info">
                <a href="mailto:info.sharpproperties@gmail.com" class="contact-item">
                    <span class="contact-icon">&#9993;</span>
                    info.sharpproperties@gmail.com
                </a>
                <a href="tel:+923321738817" class="contact-item">
                    <span class="contact-icon">&#9742;</span>
                    +92 332 1738817
                </a>
            </div>
        </div>
    </div>
</body>
</html>
